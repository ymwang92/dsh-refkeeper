url: https://github.com/ymwang92/dsh-refkeeper
name: ymwang92/dsh-refkeeper
category: tools
description:
  en: Verify and export the references your AI conversation already cited — BibTeX/RIS with evidence-anchored annotations, checked against Crossref, OpenAlex, arXiv and DataCite.
  zh: 把对话里已经引用过的文献核验清楚再导出——BibTeX / RIS，注解锚定原句，先过 Crossref、OpenAlex、arXiv、DataCite 四道注册表。
