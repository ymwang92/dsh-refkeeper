# Copy this file into the awesome-dsh-plugin repo as
#   data/plugins/<owner>__dsh-refkeeper.yml
# and open a pull request there. One YAML file per plugin is the whole
# submission; the READMEs are generated from these files.
url: https://github.com/ymwang92/dsh-refkeeper
name: ymwang92/dsh-refkeeper
category: tools
description:
  en: Collects the papers a DeepSeek Harness conversation cited, checks each one against Crossref, OpenAlex, arXiv and DataCite, and exports the confirmed entries as BibTeX or RIS.
  zh: 收集对话里引用过的文献，逐条到 Crossref、OpenAlex、arXiv、DataCite 核对，通过核对的导出为 BibTeX 或 RIS。
# optional storefront tile; without it the market falls back to your avatar
icon: https://raw.githubusercontent.com/ymwang92/dsh-refkeeper/main/docs/images/icon.png
# prebuilt package, so installs skip the build-approval step
tarball: https://github.com/ymwang92/dsh-refkeeper/releases/download/v0.1.0/dsh-refkeeper-0.1.0.tgz
